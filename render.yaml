services:
  - type: web
    name: wikispeedrun-multiplayer
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGIN
        sync: false
      - key: REQUIRE_ALLOWED_ORIGIN
        value: "true"
      - key: TEACHER_ACCESS_CODE
        sync: false
